[project]
name = "trustlens-experiments"
version = "0.1.0"
description = "Experiments for: TrustLens — Certifiable Anomaly Detection for Auditable AI Agent Permissions"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5.0",
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "matplotlib>=3.10.0",
    "scikit-learn>=1.6.0",
    "tqdm>=4.67.0",
    "orjson>=3.11.0",
    "pydantic>=2.11.0",
    "scipy>=1.14.0",
    "statsmodels>=0.14.0",
    "sentence-transformers>=5.3.0",
    "accelerate>=1.13.0",
    "boto3>=1.42.70",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "datasets>=4.6.1",
    "gdown>=5.2.1",
]
